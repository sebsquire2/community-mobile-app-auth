services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: auth_showcase
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      ENV: development
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/auth_showcase
      CORS_ALLOW_ORIGINS: "http://localhost:8081,http://localhost:3000"
    depends_on:
      db:
        condition: service_healthy
